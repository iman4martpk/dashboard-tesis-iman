name: 🔄 Jalur 1 - Scrape Realtime (Tiap Jam via GAS)

on:
  repository_dispatch:
    # 🎯 Menangkap sinyal event_type "run_scrape_hourly" yang ditembak oleh GAS
    types: [run_scrape_hourly] 
    
  workflow_dispatch: 
    # 🛠️ Tetap memunculkan tombol manual "Run workflow" di tab Actions buat test drive

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    
    # 🔑 Posisi permission harus sejajar di bawah runs-on (2x spasi dari kiri)
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml pytz
          
      - name: ⚙️ Eksekusi Script Scraper
        run: python scrape_hourly.py
        
      - name: 📤 Commit & Push Perubahan Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HASIL_FINAL_TESIS_PASUT_HIBRIDA.csv HASIL_FINAL_TESIS_PASUT_LSTM_MURNI.csv
          # Logika aman: jika data jam tersebut sudah ada/sama, script tidak akan error dan langsung skip
          git commit -m "🤖 Auto-update data observasi via GAS (Jalur 1)" || echo "Tidak ada perubahan data untuk dicommit."
          git push
