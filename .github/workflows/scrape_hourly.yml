- name: 🛰️ Jalur 1 - Scraper TMA 30 Menitan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Posisikan Git pada branch main secara bersih
          git fetch origin main
          git checkout main
          
          # 2. Masukkan file observasi yang berubah ke antrean staging area
          git add HASIL_FINAL_TESIS_PASUT_OBSERVASI.csv
          
          # 3. Cek apakah benar-benar ada data baru yang masuk
          if ! git diff --cached --quiet; then
            echo "✅ Data observasi baru terdeteksi. Bersiap melakukan commit..."
            git commit -m "🤖 Auto-scrape: Update data observasi aktual TMA Pasar Ikan"
            
            # 4. Ambil update terbaru dari server dengan aman, lalu push
            git pull origin main --rebase -X theirs
            git push origin main
          else
            echo "ℹ️ Tidak ada data baru dari situs target. Proses push dilewati."
          fi
