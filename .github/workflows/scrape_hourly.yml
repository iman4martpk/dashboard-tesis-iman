name: 🛰️ Jalur 1 - Scraper TMA 30 Menitan (Hourly)

on:
  schedule:
    # Berjalan otomatis setiap 30 menit
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Memunculkan tombol "Run workflow" manual di GitHub Actions

jobs:
  scrape_and_update_data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'
          
      - name: 📦 Install Dependencies Scraper
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml
          
      - name: 🌐 Eksekusi Script Scraper TMA
        run: |
          # Pastikan nama file .py di bawah ini sesuai dengan nama script scraper lu ya!
          python scrape_hourly.py
        
      - name: 📤 Commit & Push Hasil Scrape Observasi Terbaru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Posisikan Git pada branch main secara bersih
          git fetch origin main
          git checkout main
          
          # 2. Masukkan file observasi yang berubah ke antrean staging area
          git add HASIL_FINAL_TESIS_PASUT_OBSERVASI.csv
          
          # 3. Cek apakah benar-benar ada data baru yang masuk
          if ! git diff --cached --quiet; then
            echo "✅ Data observasi baru terdeteksi. Bersiap melakukan commit..."
            git commit -m "🤖 Auto-scrape: Update data observasi aktual TMA Pasar Ikan"
            
            # 4. Ambil update terbaru dari server dengan aman (anti-bentrok), lalu push
            git pull origin main --rebase -X theirs
            git push origin main
          else
            echo "ℹ️ Tidak ada data baru dari situs target. Proses push dilewati."
          fi
