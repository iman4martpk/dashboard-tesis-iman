name: 🔄 Jalur 2 - Retrain ML Pipeline (Mingguan via GAS)

on:
  repository_dispatch:
    types: [trigger_ml_pipeline] # 🎯 SINKRONKAN: Pastikan payload GAS mengirim event_type ini!
  workflow_dispatch:

# Satu run pada satu waktu; run yang antre tidak jalan paralel (hindari tabrakan commit model).
concurrency:
  group: ml-pipeline
  cancel-in-progress: false

jobs:
  train_and_update_model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 🔑 WAJIB: Izin token internal untuk melakukan git push
          fetch-depth: 0             # 📚 WAJIB: Mengambil seluruh history commit agar rebase tidak error

      - name: 🛡️ Guard - lewati trigger otomatis bila retrain terakhir < 5 hari lalu
        id: guard
        if: github.event_name == 'repository_dispatch'
        run: |
          last=$(git log -1 --format=%ct --grep="Auto-retrain" || true)
          now=$(date +%s)
          if [ -n "$last" ] && [ $((now - last)) -lt 432000 ]; then
            echo "ℹ️ Retrain terakhir kurang dari 5 hari lalu. Trigger ini dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐍 Set up Python (Disamakan dengan Laptop)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'  # Sesuai spek laptop
          cache: 'pip'
          
      - name: 📦 Install ML Dependencies (versi di-pin, disamakan dengan laptop)
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.5.4 \
            pandas==3.0.0 \
            scikit-learn==1.8.0 \
            tensorflow==2.21.0 \
            joblib==1.5.3 \
            pyarrow==24.0.0 \
            plotly==6.7.0 \
            requests==2.32.3 \
            lxml==6.0.4 \
            streamlit==1.56.0
          
      - name: 🧠 Eksekusi Script Training & Forecast Seq2Seq
        if: steps.guard.outputs.skip != 'true'
        run: python retrain_and_forecast.py 
        
      - name: 📤 Commit & Push Update Model Baru & Hasil Forecast
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Pastikan posisi Git berada di branch main yang paling update
          git fetch origin main
          git checkout main
          
          # 2. Stage semua aset model, scaler, dan CSV hasil ramalan 7 hari terbaru
          for f in model_pasar_ikan_lstm_murni_master.keras \
                   model_pasar_ikan_master.keras \
                   scaler_residu_pasar_ikan.save \
                   scaler_tma_pasar_ikan_lstm_murni.save \
                   HASIL_FINAL_TESIS_PASUT_HIBRIDA.csv \
                   HASIL_FINAL_TESIS_PASUT_LSTM_MURNI.csv \
                   STATUS_PIPELINE.json \
                   LOG_VERIFIKASI_MINGGUAN.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          
          # 3. Cek perubahan, jika ada lakukan rebase aman lalu push ke server
          if ! git diff --cached --quiet; then
            echo "✅ Perubahan model & forecast terdeteksi. Melakukan commit..."
            git commit -m "🤖 Auto-retrain & update LSTM model + 7-days forecast CSV (Jalur 2 - Synced Environment)"
            git pull --rebase origin main -X theirs
            git push origin main
          else
            echo "ℹ️ Tidak ada perubahan pada model maupun data prediksi. Lewati proses push."
          fi
