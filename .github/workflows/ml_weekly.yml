name: 🔄 Jalur 2 - Retrain ML Pipeline (Mingguan via GAS)

on:
  repository_dispatch:
    # 🎯 Menangkap sinyal event_type yang ditembak oleh GAS Mingguan
    types: [trigger_ml_pipeline]
    
  workflow_dispatch:
    # 🛠️ Tetap memunculkan tombol manual buat test drive kapan aja

jobs:
  train_and_update_model:
    runs-on: ubuntu-latest
    
    # 🔑 Membuka izin agar robot bisa push file model (.keras/.save) setelah ditraining
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Mempercepat proses install untuk minggu-minggu berikutnya
          
      - name: 📦 Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          # 🚀 Otomatis menginstal library tensorflow, scikit-learn, dll dari requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: 🧠 Eksekusi Script Training Model LSTM
        # ⚠️ Pastikan nama file python di bawah ini sesuai dengan nama script training!
        run: python train_weekly.py 
        
      - name: 📤 Commit & Push Update Model Baru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Daftarkan file model master dan scaler terbaru (Hibrida & LSTM Murni) ke staging area
          git add model_pasar_ikan_lstm_murni_master.keras model_pasar_ikan_master.keras scaler_residu_pasar_ikan.save scaler_tma_pasar_ikan_lstm_murni.save
          
          # 2. Sinkronisasi riwayat Git biar gak bentrok
          git fetch origin main
          git reset --mixed origin/main
          
          # 3. Add ulang setelah reset agar siap di-commit
          git add model_pasar_ikan_lstm_murni_master.keras model_pasar_ikan_master.keras scaler_residu_pasar_ikan.save scaler_tma_pasar_ikan_lstm_murni.save
          
          # 4. Commit dan push secara aman jika ada perubahan file model setelah retraining
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-retrain & update LSTM model master (Jalur 2)"
            git pull --rebase origin main
            git push origin main
          else
            echo "Tidak ada perubahan pada file model. Lewati proses push."
          fi
