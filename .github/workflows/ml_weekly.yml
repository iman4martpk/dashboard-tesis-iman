name: 🔄 Jalur 2 - Retrain ML Pipeline (Mingguan via GAS)

on:
  repository_dispatch:
    types: [trigger_ml_pipeline]
  workflow_dispatch:

jobs:
  train_and_update_model:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python (Disamakan dengan Laptop Lu)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'  # Sesuai spek laptop lu
          cache: 'pip'
          
      - name: 📦 Install ML Dependencies (Kunci Versi Tesis Lu)
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==3.0.0 scikit-learn==1.8.0 tensorflow==2.21.0 joblib==1.5.3 plotly requests lxml streamlit
          
      - name: 🧠 Eksekusi Script Training & Forecast Seq2Seq
        run: python retrain_and_forecast.py 
        
      - name: 📤 Commit & Push Update Model Baru & Hasil Forecast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add model_pasar_ikan_lstm_murni_master.keras model_pasar_ikan_master.keras scaler_residu_pasar_ikan.save scaler_tma_pasar_ikan_lstm_murni.save HASIL_FINAL_TESIS_PASUT_HIBRIDA.csv HASIL_FINAL_TESIS_PASUT_LSTM_MURNI.csv
          
          git fetch origin main
          git reset --mixed origin/main
          
          git add model_pasar_ikan_lstm_murni_master.keras model_pasar_ikan_master.keras scaler_residu_pasar_ikan.save scaler_tma_pasar_ikan_lstm_murni.save HASIL_FINAL_TESIS_PASUT_HIBRIDA.csv HASIL_FINAL_TESIS_PASUT_LSTM_MURNI.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-retrain & update LSTM model + forecast CSV (Jalur 2 - Synced Environment)"
            git pull --rebase origin main
            git push origin main
          else
            echo "Tidak ada perubahan pada model maupun data prediksi. Lewati proses push."
          fi
